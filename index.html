<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mattbox.win</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
    <style>
        * {
            box-sizing: border-box;
        }
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --text-muted: #555555;
            --accent-green: #497A47;
            --accent-border: rgba(73, 122, 71, 0.25);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #f0f0f0;
                --text-muted: #a0a0a0;
                --accent-border: rgba(73, 122, 71, 0.4);
            }
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 2rem 1rem;
            text-align: center;
            border-top: 4px solid var(--accent-green);
        }
        main {
            max-width: 650px;
            width: 100%;
        }
        h1 {
            font-size: 2.5em;
            line-height: 1.2;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.15em;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <main>
        <h1>mattbox.win</h1>
        <p>Thanks for stopping by! This is just my site for experimenting with Cloudflare :)<br>
            Please don't judge me - I don't know anything about web development...
        </p>
    </main>
</body>
</html>
